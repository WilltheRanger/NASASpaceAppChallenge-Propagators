# Runs every Python test suite and type-checks + builds the site on each push to main and each pull request,
# so a broken merge shows up before the deploy (pages.yml) publishes it.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: scripts/test_all.sh python

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build   # tsc --noEmit + vite build
        working-directory: frontend
      - run: npm test        # fire-context (EONET parser) + story-limits (verdicts, Ask Anchor)
        working-directory: frontend
