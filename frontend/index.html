<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anchor · Fire counts on a fixed clock</title>
  <meta name="description" content="Aqua, the satellite behind Brazil's official fire count, now looks later in the day. Anchor compares its count with what we'd expect at its old time, in six places. Team Propagators, NASA Space Apps Challenge 2026.">
  <meta property="og:title" content="Anchor · Fire counts on a fixed clock">
  <meta property="og:description" content="Aqua, the satellite behind Brazil's official fire count, now looks later in the day. Anchor compares its count with what we'd expect at its old time, in six places. Team Propagators, NASA Space Apps Challenge 2026.">
  <meta name="theme-color" content="#0B0D0B">
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- font stylesheet loads without blocking first paint; text shows in the fallback until it arrives -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet"></noscript>
  <!-- the Regions page's first picture (its region's poster; FEATURED in common.tsx) starts downloading before the script runs -->
  <script>(() => {
    const u = location.search + location.hash
    if (/[?&#]round=/.test(u)) return
    const region = /[?&#]region=([\w-]+)/.exec(u)
    const page = /[?&#]page=([\w-]+)/.exec(u)
    // the Regions page: ?region=…, ?page=regions, or ?page=app (the audit page's old address)
    if (!region && !(page && /^(regions|app)$/.test(page[1]))) return
    if (page && !/^(regions|app)$/.test(page[1])) return
    const l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.fetchPriority = 'high'
    l.href = `video/regions/${region ? region[1] : 'br-amazon'}-poster.jpg`
    document.head.appendChild(l)
  })()</script>
  <style>html, body { background: #0B0D0B; color: #ECE9E1; color-scheme: dark; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
