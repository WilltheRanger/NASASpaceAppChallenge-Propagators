  <!-- the Regions page's first picture (its region's poster; FEATURED in common.tsx) starts downloading before the script runs -->
  <script>(() => {
    const u = location.search + location.hash
    if (/[?&#]round=/.test(u)) return
    const region = /[?&#]region=([\w-]+)/.exec(u)
    const page = /[?&#]page=([\w-]+)/.exec(u)
    // the Regions page: ?region=…, ?page=regions, or ?page=app (the audit page's old address)
    if (!region && !(page && /^(regions|app)$/.test(page[1]))) return
    if (page && !/^(regions|app)$/.test(page[1])) return
    const l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.fetchPriority = 'high'
    l.href = `video/regions/${region ? region[1] : 'br-amazon'}-poster.jpg`
    document.head.appendChild(l)
  })()</script>
